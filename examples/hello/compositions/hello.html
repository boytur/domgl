<!doctype html>
<html data-resolution="portrait">
<head>
<meta charset="utf-8">
<title>hello</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #101014; }
  #root { position: absolute; inset: 0; background: #1b1a17; overflow: hidden; }
  .bg   { position: absolute; inset: 0; background: #22303a; }
  .card {
    position: absolute; left: 240px; top: 760px; width: 600px; height: 400px;
    background: #f2b233; border: 10px solid #1b1a17; border-radius: 28px;
    display: grid; place-items: center;
  }
  .card h1 { margin: 0; font: 700 96px/1 "Segoe UI", system-ui, sans-serif; color: #1b1a17; }
  .dot {
    position: absolute; left: 500px; top: 380px; width: 80px; height: 80px;
    border-radius: 50%; background: #7fc7e3; border: 8px solid #1b1a17;
  }
  .footer {
    position: absolute; left: 0; right: 0; bottom: 120px; text-align: center;
    font: 600 44px/1.4 "Segoe UI", system-ui, sans-serif; color: #f7ebd2;
  }
</style>
</head>
<body>
<div id="root" data-composition-id="hello" data-start="0" data-duration="3.000" data-width="1080" data-height="1920">
  <div class="bg"></div>
  <div class="dot"></div>
  <div class="card"><h1>domgl</h1></div>
  <div class="footer">HTML + GSAP → WebGL → mp4</div>
</div>

<script>
  // domgl injects gsap and an empty window.__timelines before this script.
  // If you open this file directly in a browser, the CDN tag above covers gsap.
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  // pop the card in, then breathe
  tl.fromTo(".card", { scale: 0.82, y: 60, opacity: 0 },
    { scale: 1, y: 0, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, 0.1);
  tl.to(".dot", { y: -40, duration: 0.6, ease: "power2.out" }, 0.7);
  tl.to(".dot", { y: 0, duration: 0.5, ease: "bounce.out" }, 1.3);
  tl.fromTo(".footer", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4 }, 1.6);
  tl.to("#root", { scale: 1.04, duration: 3.0, ease: "none" }, 0);

  window.__timelines["hello"] = tl;
</script>
</body>
</html>
